[project]
name = "common"
version = "0.1.0"
description = ""
authors = [{name = "Andrew Rutherfoord", email = "andrew.rutherfoord@live.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.4",
    "sqlmodel>=0.0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-sugar",
    "pytest-cov",
    "black",
    "mypy",
    "ruff",
    "isort",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(message)s"
