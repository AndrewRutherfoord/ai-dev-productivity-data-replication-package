[project]
name = "driller"
version = "0.1.0"
description = ""
authors = [{name = "Andrew Rutherfoord", email = "andrew.rutherfoord@live.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "common",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "async-timeout>=4.0.3",
    "pydriller>=2.6",
    "neo4j>=5.20.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.22.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.2",
    "pytest-mock>=3.14.0",
    "coverage>=7.5.4",
]

[project.scripts]
driller-worker = "src.main:exec"
test-client = "src.test_client:exec"
test-config-driller = "src.config_driller:main"

[tool.uv.sources]
common = { path = "../common", editable = true }

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(message)s"
log_file = "pytest.log"
log_file_level = "INFO"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
norecursedirs = ["repos"]