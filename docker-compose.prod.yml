version: "3.9"

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  redis_data:
  postgres_data:

networks:
  app:
    name: neorepro_app
    driver: bridge

services:
  neo4j:
    image: neo4j:5.18
    container_name: neo4j
    restart: unless-stopped
    networks:
      - app
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_PLUGINS: '["apoc","apoc-extended"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - ./volumes/neo4j_import:/var/lib/neo4j/import
    ports:
      - "7687:7687"
      - "7474:7474"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neorepro-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - app
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: neorepro-postgres
    restart: unless-stopped
    networks:
      - app
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/andrewrutherfoord/neorepro-msr-tool/backend:latest
    container_name: backend
    restart: unless-stopped
    networks:
      - app
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_BROKER_DB: 1
      NEO4J_HOST: neo4j
      NEO4J_PORT: 7687
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./volumes/configs:/app/configs
      - ./volumes/queries:/app/queries
      - ./volumes/neo4j_import:/app/neo4j_import
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  driller-worker:
    image: ghcr.io/andrewrutherfoord/neorepro-msr-tool/driller:latest
    restart: unless-stopped
    networks:
      - app
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_BROKER_DB: 1
      NEO4J_HOST: neo4j
      NEO4J_PORT: 7687
      BACKEND_URL: http://backend:8000
    volumes:
      - ./volumes/repos:/app/repositories
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A src.celery_app worker
      --loglevel=info
      --concurrency=3
      -Q driller_queue

  frontend:
    image: ghcr.io/andrewrutherfoord/neorepro-msr-tool/frontend:latest
    container_name: frontend
    restart: unless-stopped
    networks:
      - app
    depends_on:
      - backend
    expose:
      - "80"