
volumes:
  neo4j:
  redis:
  postgres:

services:
  neo4j:
    container_name: neo4j
    image: neo4j:latest
    hostname: "neo4j"
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc", "apoc-extended"]
      - NEO4J_dbms_memory_transaction_total_max=10G
      - NEO4J_dbms_memory_heap_initial__size=2G
      - NEO4J_dbms_memory_heap_max__size=4G
    volumes:
      - neo4j:/data
      - neo4j:/logs
      - neo4j:/plugins

      # Location where Database Dump files are stored. Also loaded from here.
      - ./volumes/neo4j_import:/var/lib/neo4j/import

  # Redis for Celery message broker and result storage
  redis:
    image: redis:7-alpine
    container_name: neorepro-redis
    hostname: "redis"
    # ports:
    #   - "6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL for backend database
  postgres:
    image: postgres:16-alpine
    container_name: neorepro-postgres
    hostname: "postgres"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  driller-worker:
    build:
      context: ./
      dockerfile: ./driller/Dockerfile
    environment:
      - LOG_LEVEL=${DRILLER_LOG_LEVEL}
      - NEO4J_LOG_LEVEL=${DRILLER_NEO4J_LOG_LEVEL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_BROKER_DB=1
      - NEO4J_HOST=neo4j
      - NEO4J_PORT=7687
      - BACKEND_URL=http://backend:8000
    env_file: .env
    volumes:
      - ./driller/src:/app/driller/src # For Development
      - ./common/src:/app/common/src # For Development
      - ./volumes/repos:/app/repositories # Location of Repos to Drill/Where they will be cloned.
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
    command: celery -A src.celery_app worker --loglevel=info --concurrency=1 -Q driller_queue
    deploy:
      replicas: 2

  backend:
    container_name: backend
    ports:
      - ${BACKEND_PORT}:8000
    build:
      context: ./
      dockerfile: ./backend/Dockerfile
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_BROKER_DB=1
      - DATABASE_URL=${DATABASE_URL}
    # network_mode: host
    volumes:
      - ./backend/src:/app/backend/src # For Development
      - ./common/src:/app/common/src # For Development

      - ./volumes/queries:/app/queries # Location of Cypher Queries
      - ./volumes/configs:/app/configs # Location of Drill Config Files
      - ./volumes/neo4j_import/:/app/neo4j_import/
    depends_on:
      neo4j:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    container_name: frontend
    ports:
      - ${FRONTEND_PORT}:5173
    build:
      context: ./
      dockerfile: ./frontend/Dockerfile
    volumes:
      - ./frontend/src:/app/frontend/src # For Development
      - ./schemas/:/app/schemas/
      - ./README.md:/app/README.md:ro # For Development
    depends_on:
      - backend
